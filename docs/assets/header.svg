<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="CIVITAS OS — Peradaban Nusantara Digital Otonom">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="1" stop-color="#1c2b1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd24d"/>
      <stop offset="0.5" stop-color="#ffaa00"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </linearGradient>
    <pattern id="dirt" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#8a5a3b"/>
      <rect x="2" y="3" width="5" height="4" fill="#7a4c30"/>
      <rect x="9" y="10" width="5" height="4" fill="#9a6a45"/>
      <rect x="11" y="1" width="3" height="3" fill="#7a4c30"/>
    </pattern>
    <pattern id="grass" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#5f8f43"/>
      <rect x="1" y="1" width="6" height="5" fill="#6da04e"/>
      <rect x="9" y="8" width="6" height="5" fill="#548239"/>
    </pattern>
  </defs>

  <rect width="960" height="220" fill="url(#sky)"/>

  <!-- bintang piksel -->
  <g fill="#ffffff" opacity="0.8">
    <rect x="60" y="24" width="3" height="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="210" y="40" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="420" y="18" width="3" height="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="640" y="34" width="3" height="3"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="860" y="26" width="3" height="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></rect>
  </g>

  <!-- matahari/ledger buku emas melayang -->
  <g transform="translate(810,52)">
    <rect x="-26" y="-20" width="52" height="40" fill="#3a2c10" stroke="#ffd24d" stroke-width="4"/>
    <rect x="-18" y="-10" width="36" height="4" fill="#ffaa00"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="-18" y="-2" width="36" height="4" fill="#ffaa00"/>
    <rect x="-18" y="6" width="24" height="4" fill="#ffaa00"/>
    <animateTransform attributeName="transform" type="translate" values="810,52; 810,44; 810,52" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- kota piksel: istana + menara + rumah -->
  <g>
    <rect x="70" y="96" width="120" height="70" fill="url(#dirt)"/>
    <rect x="66" y="88" width="128" height="10" fill="#c6c6c6"/>
    <rect x="100" y="60" width="60" height="30" fill="url(#dirt)"/>
    <rect x="96" y="52" width="68" height="10" fill="#4aedd9"/>
    <rect x="120" y="34" width="20" height="20" fill="#c6c6c6"/>
    <rect x="118" y="22" width="24" height="14" fill="#ffaa00"><animate attributeName="fill" values="#ffaa00;#ffd24d;#ffaa00" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="220" y="112" width="46" height="54" fill="url(#dirt)"/>
    <rect x="216" y="104" width="54" height="10" fill="#b8945f"/>
    <rect x="300" y="122" width="46" height="44" fill="url(#dirt)"/>
    <rect x="296" y="114" width="54" height="10" fill="#b8945f"/>
    <rect x="128" y="118" width="14" height="14" fill="#2b2b2b"/>
    <rect x="230" y="126" width="10" height="12" fill="#ffd24d"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="310" y="132" width="10" height="12" fill="#7efc20"/>
  </g>

  <!-- tanah -->
  <rect x="0" y="166" width="960" height="14" fill="url(#grass)"/>
  <rect x="0" y="180" width="960" height="40" fill="url(#dirt)"/>

  <!-- villager warga (piksel) berjalan -->
  <g fill="#b8945f">
    <g>
      <rect x="380" y="136" width="18" height="18" fill="#c69a6d"/>
      <rect x="377" y="130" width="24" height="10" fill="#b8860b"/>
      <rect x="385" y="152" width="4" height="14"/><rect x="393" y="152" width="4" height="14"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 26,0; 0,0" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="520" y="136" width="18" height="18" fill="#9a6a45"/>
      <rect x="517" y="130" width="24" height="10" fill="#5f8f43"/>
      <rect x="525" y="152" width="4" height="14"/><rect x="533" y="152" width="4" height="14"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -34,0; 0,0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="660" y="136" width="18" height="18" fill="#c69a6d"/>
      <rect x="657" y="130" width="24" height="10" fill="#4a1a1a"/>
      <rect x="665" y="152" width="4" height="14"/><rect x="673" y="152" width="4" height="14"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 18,0; 0,0" dur="7.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- judul animasi (mandat #7) -->
  <text x="480" y="86" text-anchor="middle" font-family="'Press Start 2P','VT323',monospace" font-size="42" font-weight="bold" fill="url(#gold)" stroke="#2b2b2b" stroke-width="2" letter-spacing="4">
    CIVITAS OS
    <animate attributeName="y" values="86;82;86" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="118" text-anchor="middle" font-family="'VT323',monospace" font-size="22" fill="#7efc20" letter-spacing="2">
    PERADABAN NUSANTARA DIGITAL — AUTONOMOUSLY AUTONOMOUS
    <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
