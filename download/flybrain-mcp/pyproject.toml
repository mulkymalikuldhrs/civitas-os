[project]
name = "flybrain-mcp"
version = "0.1.0"
description = "FlyBrain MCP - universal 'brain' infrastructure: connectome tools + persistent operational memory for AI agents, robots, drones, and IoT devices (Model Context Protocol)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FlyBrain MCP contributors" }]
keywords = ["mcp", "flywire", "connectome", "agent-memory", "robotics", "iot"]
dependencies = [
    "fastmcp>=2.0",
]

[project.optional-dependencies]
connectome = ["caveclient>=7.0"]
dev = ["pytest>=8.0"]

[project.scripts]
flybrain-mcp = "flybrain_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain_mcp"]
